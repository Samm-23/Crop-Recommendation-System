<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crop Recommendation System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">
    <style>
        h1 {
            color: mediumseagreen;
            text-align: center;
        }

        .warning {
            color: red;
            font-weight: bold;
            text-align: center;
        }

        .container {
            background: #edf2f7;
            font-weight: bold;
            padding-bottom: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        body {
            background: #BCBBB8;
        }
    </style>
  </head>

  <body>
  

<!--======================= Form Section =============================-->
  <div class="container my-5">
      <h1 class="text-success">Crop Recommendation System <span>🌱</span></h1>

      <form action="/predict" method="POST" enctype="multipart/form-data">
          <div class="row">
              <div class="col-md-4">
                  <label for="Nitrogen">Nitrogen</label>
                  <input type="number" id="Nitrogen" name="Nitrogen" placeholder="Enter Nitrogen" class="form-control" required step="0.01">
              </div>
              <div class="col-md-4">
                  <label for="Phosphorus">Phosphorus</label>
                  <input type="number" id="Phosphorus" name="Phosphorus" placeholder="Enter Phosphorus" class="form-control" required step="0.01">
              </div>
              <div class="col-md-4">
                  <label for="Potassium">Potassium</label>
                  <input type="number" id="Potassium" name="Potassium" placeholder="Enter Potassium" class="form-control" required step="0.01">
              </div>
          </div>

          <div class="row mt-4">
              <div class="col-md-4">
                  <label for="Temperature">Temperature (°C)</label>
                  <input type="number" step="0.01" id="Temperature" name="Temperature" placeholder="Enter Temperature" class="form-control" required>
              </div>
              <div class="col-md-4">
                  <label for="Humidity">Humidity (%)</label>
                  <input type="number" step="0.01" id="Humidity" name="Humidity" placeholder="Enter Humidity" class="form-control" required>
              </div>
              <div class="col-md-4">
                  <label for="pH">pH</label>
                  <input type="number" step="0.01" id="pH" name="pH" placeholder="Enter pH" class="form-control" required>
              </div>
          </div>

          <div class="row mt-4">
              <div class="col-md-4">
                  <label for="Rainfall">Rainfall (mm)</label>
                  <input type="number" step="0.01" id="Rainfall" name="Rainfall" placeholder="Enter Rainfall" class="form-control" required>
              </div>
          </div>

          <div class="row mt-4">
            <div class="col-md-12">
                <label for="soil_image">Upload Soil Image (optional)</label>
                <input type="file" id="soil_image" name="soil_image" class="form-control" accept="image/*">
            </div>
          </div>

          <div class="row mt-4">
              <div class="col-md-12 text-center">
                  <button type="submit" class="btn btn-primary btn-lg">Get Recommendation</button>
              </div>
          </div>
      </form>

<!--======================= Result Card =============================-->
	{% if result %}
	<div class="d-flex justify-content-center mt-5">
		<div class="card bg-dark text-white" style="width: 24rem; padding: 15px;">
			<img src="{{url_for('static', filename='img.jpg')}}" class="card-img-top" alt="Recommended Crop" style="object-fit: cover; height: 200px;">
			<div class="card-body text-center">
				<h5 class="card-title">Recommended Crop:</h5>
				<p class="card-text">{{ result }}</p>
			</div>
		</div>
	</div>
	{% endif %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ENjdO4Dr2bkBIFxQpeoTz1HIcje39Wm4jDKdf19U8gI4ddQ3GYNS7NTKfAdVQSZe" crossorigin="anonymous"></script>
  </body>
</html>
